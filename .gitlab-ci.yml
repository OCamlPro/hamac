#############################################################################
# GitLab CI/CD pour hamac — build des images de provisioning bare-metal.
#
# Pour l'instant, seules les images du service de provisioning bare-metal
#
# Pipeline :
#   build:hamac-discovery   (rebuild seulement si le code OCaml ou son
#                           Dockerfile a changé)
#   build:hamac-pxe         (rebuild seulement si le init script, le
#                           tftp root ou son Dockerfile a changé)
#
# Prérequis (variables groupe OCamlPro/, cf. ~/ocp/si/CICD.md) :
#
# Auth registry : CI_REGISTRY_USER/PASSWORD injectées par GitLab.
# Auth git OCamlPro/ocamlpro-stdlib : CI_JOB_TOKEN via HTTPS.
#
#############################################################################

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_DRIVER: overlay2
  # Tags d'image.
  # CI_REGISTRY_IMAGE = registry.ocamlpro.com/OCamlPro/hamac
  # CI_REGISTRY_PASSWORD ne donne accès qu'à ce sous-namespace, pas au
  # root du registry, donc on publie sous ${CI_REGISTRY_IMAGE}/hamac-*.
  # Pour les consommateurs (stack.yaml OCP-SI) : référencer
  #   registry.ocamlpro.com/OCamlPro/hamac/hamac-discovery:<tag>
  #   registry.ocamlpro.com/OCamlPro/hamac/hamac-pxe:<tag>
  IMAGE_DISCOVERY: "${CI_REGISTRY_IMAGE}/hamac-discovery"
  IMAGE_PXE: "${CI_REGISTRY_IMAGE}/hamac-pxe"
  # Noyau/initrd du netboot installer Debian : utilisés comme base de
  # l'initramfs "live" pendant le PXE boot (5 minutes, le temps que l'init
  # script télécharge et écrive la vraie Debian sur le disque). Pas l'OS
  # final en tant que tel, mais de la même famille — voir
  # doc/PROVISIONING_SPEC.md.
  #
  # Anciennement noyau Alpine `lts` : abandonné après investigation
  # (cf. HAMAC_PXE_FREEZE_INVESTIGATION.md) — ce noyau ne
  # produit AUCUNE sortie console sur un Framework Laptop 13 (Intel Core
  # Ultra Series 1 / Meteor Lake), freeze total et silencieux dès son
  # exécution par iPXE, indépendamment de la conf PXE/dnsmasq/iPXE (déjà
  # validée par ailleurs comme fonctionnelle). Le noyau/initrd officiels
  # du netboot installer Debian bootent normalement sur ce même matériel
  # (testé et confirmé manuellement avant ce changement).
  #
  # SHA256 pinnés explicitement pour reproductibilité, même logique
  # qu'avec Alpine précédemment : si Debian change ces fichiers (même URL,
  # contenu différent), le build casse au verify et il faut bumper les
  # SHA après test manuel de l'initramfs. Note : l'URL "current" pointe
  # vers le dernier point-release stable de Debian, donc CASSERA au
  # prochain point-release (attendu, pas un bug) — rebump le SHA256 à ce
  # moment-là.
  DEBIAN_NETBOOT_URL: "https://deb.debian.org/debian/dists/stable/main/installer-amd64/current/images/netboot/debian-installer/amd64"
  DEBIAN_LINUX_SHA256: "e7667ff961fcf0f872e2618a930454a6362ce58995f386431f60a5169c85f41a"
  DEBIAN_INITRD_SHA256: "c8b67f68fb34d3bc91935564255b8f3404199f44fab227672e4861a62434dad5"
  # busybox-static : le busybox de l'installeur netboot Debian n'implémente
  # PAS `--install` (utilisé par notre init pour créer les symlinks
  # d'applets dans /bin et /sbin) — sous `set -e`, ça faisait avorter
  # notre init immédiatement (`Kernel panic - not syncing: Attempted to
  # kill init!`), testé et confirmé en local avant ce changement (cf.
  # HAMAC_PXE_FREEZE_INVESTIGATION.md). On remplace donc le
  # busybox de l'initrd par le busybox-static de Debian (complet,
  # statique, supporte `--install`) avant repack.
  # URL snapshot.debian.org (pas deb.debian.org/.../pool/...) : Debian
  # retire du pool les anciens binNMU (`+bN`) d'un paquet dès qu'un
  # nouveau est buildé, même sans changement de version source ni
  # point-release côté hamac — un `pool/` pinné en dur sur une version
  # exacte a fini par 404 pour cette raison précise (rencontré réellement
  # en CI). snapshot.debian.org sert un fichier par son hash, jamais
  # recyclé/retiré : plus de rebump surprise. Rebump volontaire (nouvelle
  # version de busybox-static) : trouver le hash via
  # `https://snapshot.debian.org/mr/binary/busybox-static/<version>/binfiles?fileinfo=1`
  # (version avec epoch si applicable, ex. `1:1.37.0-6+b8`), prendre le
  # hash de l'entrée `"architecture":"amd64"`, l'URL finale est
  # `https://snapshot.debian.org/file/<hash>`.
  BUSYBOX_STATIC_URL: "https://snapshot.debian.org/file/7c87a0b1d84991b9ebe331f38ddddaaae22fe145"
  BUSYBOX_STATIC_SHA256: "73efc773b070ea220c5d7cb2d12206ec235c46b03a9ad133d1f6a7ca62201e41"
  # linux-image (paquet noyau COMPLET, pas l'installeur) : le netboot
  # initrd.gz de Debian ne fournit AUCUN driver NVMe, ni en module ni en
  # builtin (confirmé : absent de modules.builtin) — d-i le charge
  # normalement via un udeb séparé pendant une vraie installation, mais
  # il n'existe même pas de "nvme-modules-*-di" au catalogue (vérifié sur
  # Packages.gz), NVMe n'étant apparemment pas proposé comme composant
  # udeb du tout. Le Framework Laptop 13 (comme tout matériel récent)
  # n'a qu'un SSD NVMe interne, donc `detect_disk()` dans pxe-build/init
  # ne trouve jamais de disque sans ces 3 fichiers. Récupérés du paquet
  # noyau normal (même version EXACTE que DEBIAN_LINUX_SHA256 ci-dessus,
  # vermagic garanti compatible) plutôt que d'un udeb inexistant. URL
  # fixe via snapshot.debian.org (archive permanente, contrairement à
  # "current" ci-dessus) car cette version précise de linux-image n'est
  # plus la dernière sur deb.debian.org — pas de dérive automatique
  # attendue, seulement si on bump DEBIAN_LINUX_SHA256/INITRD_SHA256.
  LINUX_IMAGE_URL: "https://snapshot.debian.org/file/0402b2e2587e557ca9df501c4f627f7a8bc7080f"
  LINUX_IMAGE_SHA256: "e38184e9aee8814cc12559abd10437ff2970c12cd01339e871b881abd9a5344e"
  # bmaptool + zstd + liblz4/libzstd/libcrypto (pour hashlib) + python3
  # minimal+stdlib : pour écrire les images OS via `bmaptool copy` (raw.zst
  # + .bmap dérivés à l'avance, cf. doc/PROVISIONING_SPEC.md §3.1) plutôt
  # que d'embarquer qemu-utils complet (~20 paquets de dépendances
  # transitives, TLS/PKCS#11 pour l'essentiel, hors sujet pour une
  # conversion locale — testé et rejeté, cf.
  # HAMAC_PXE_FREEZE_INVESTIGATION.md). `blkdiscard` est déjà présent dans
  # l'initrd netboot Debian, rien à ajouter pour lui.
  #
  # Set exact déterminé empiriquement (pas en devinant) : extraction dans
  # une racine de test + exécution réelle de `bmaptool create`/`copy`
  # (round-trip vérifié octet pour octet) + traçage des dépendances ELF
  # réelles via `readelf -d` à chaque étape — PAS le `Depends:` déclaré
  # des paquets (qui sur-déclare : ex. libpython3.13-stdlib dépend aussi de
  # libsqlite3/libncursesw/libreadline/libdb pour dbm/curses/readline/sqlite3,
  # jamais importés par bmaptool — Python ne dlopen ses extensions C qu'à
  # l'import réel, donc ces libs ne sont pas nécessaires ici). En revanche
  # libcrypto.so.3 (paquet libssl3t64, on n'a besoin QUE de ce fichier, pas
  # libssl.so.3) l'est bien : hashlib préfère le backend OpenSSL de
  # _hashlib quand disponible.
  #
  # Toutes ces URLs sont sur snapshot.debian.org, pas deb.debian.org/.../pool/... :
  # un `pool/` pinné en dur sur une version exacte n'est PAS stable dans le
  # temps — Debian retire du pool les anciens binNMU (`+bN`) dès qu'un
  # nouveau est buildé pour la même version source, ce qui a fini par 404
  # busybox-static ci-dessus sans aucun point-release côté hamac. snapshot.
  # debian.org sert un fichier par son hash, jamais recyclé/retiré : plus de
  # rebump surprise pour une version qu'on n'a pas décidé de changer.
  # Rebump volontaire (nouvelle version d'un paquet) : trouver le hash via
  # `https://snapshot.debian.org/mr/binary/<nom-paquet>/<version>/binfiles?fileinfo=1`
  # (inclure l'epoch dans <version> si le paquet en a un, ex. `1:1.37.0-6+b8`),
  # prendre le hash de l'entrée `"architecture":"amd64"` (ou `"all"` pour
  # bmaptool), l'URL finale est `https://snapshot.debian.org/file/<hash>`.
  LIBLZ4_URL: "https://snapshot.debian.org/file/366df9ca4cd9a1009c147a612e6526be145a4732"
  LIBLZ4_SHA256: "c31ec4c7c82755a38b2f3fe066fc0c5518cc91a601a268fbcd19bdacb1f22e1e"
  ZSTD_URL: "https://snapshot.debian.org/file/68018e28d4afac4567e7ef0b4b86aa8cd888734d"
  ZSTD_SHA256: "6da09b6aad171ef9b50d6a2bb4c62f756b3561aac5e05b452b80516223e5e0f5"
  LIBZSTD1_URL: "https://snapshot.debian.org/file/96dbb7ea8dced3367f661f31964693f4919c0f9a"
  LIBZSTD1_SHA256: "2f6a2aeacfc925eba8b00ac9139bc4bfccf8cacb09eb93de067074b26948eef9"
  LIBSSL3_URL: "https://snapshot.debian.org/file/fa81f709727b16de2a82710bbe0556b58f2b3f50"
  LIBSSL3_SHA256: "b2dab3fe29c1fcb82ef58c2db0ff4bd830a442cf37b9a8b730b7b6ce87181349"
  PYTHON3_MINIMAL_URL: "https://snapshot.debian.org/file/9359a1cdee9b7f7b3ffc3615522388e26f64dcbe"
  PYTHON3_MINIMAL_SHA256: "3bafb1bf1674a6c8fc52296e1b17b54b666400fc46f6b1d0ef4c24baebc883bb"
  LIBPYTHON3_MINIMAL_URL: "https://snapshot.debian.org/file/6e6e21c2113c1eac1ac300715d71e32e98d09e85"
  LIBPYTHON3_MINIMAL_SHA256: "9be9a4e59d43ad6e237349befbd0d131e0cf79812323b5ac6427051cee7e7ca9"
  LIBPYTHON3_STDLIB_URL: "https://snapshot.debian.org/file/a1aaebe2d285ecf60729b8444ee5dff26b3fa15c"
  LIBPYTHON3_STDLIB_SHA256: "f4e759dbac49db16c4f1c3601684a9211a2af3211a3f7bdc04fff263af08a5eb"
  BMAPTOOL_URL: "https://snapshot.debian.org/file/82685902e669b19c3853e42be863fd94dc1ccf78"
  BMAPTOOL_SHA256: "25855ef25857a77a31fa750ea8239e8df250d2f20f4e303e9cbe1402db28347d"

stages:
  - build

#############################################################################
# BUILD — hamac-discovery (en deux étapes)
#
# Étape 1 — `build:hamac-discovery-binary` : compile le binaire OCaml en
# release dans une image ocaml/opam et l'expose en artefact GitLab.
#
# Étape 2 — `build:hamac-discovery-image` : recupère l'artefact dans un job
# docker:24-cli + service docker:24-dind (pattern identique aux autres
# services OCP-SI qui marche sans bricoler DinD).
#
# Ce découpage évite de mélanger ocaml/opam et DinD dans un même job, ce
# qui rend la conf DinD fragile (le daemon écoute en TLS sur 2376 par
# défaut et ignorer DOCKER_TLS_CERTDIR="" depuis une image non-docker
# n'est pas fiable).
#
# Les deux étapes utilisent les MÊMES rules:changes pour cohérence : si
# l'un ne tourne pas, l'autre non plus (`needs:` garantit la dépendance).
#############################################################################

build:hamac-discovery-binary:
  stage: build
  # ocaml/opam:* est l'image officielle OCaml. Le tag suit
  # debian-VERSION-ocaml-X.Y. Bumper en parallèle de ton opam switch local.
  image: ocaml/opam:debian-12-ocaml-5.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &discovery_paths
        - pkgs/hamac-provisioning/**/*
        - pkgs/hamac-discovery/**/*
        - docker/hamac-discovery/**/*
        # Profils + bundles built-in : embarqués dans l'image via COPY,
        # donc tout changement doit déclencher un rebuild + redeploy.
        - provisioning-profiles/**/*
        - templates/bundles/**/*
        - dune-project
        - recipe.yaml
        - opam/hamac-discovery.opam
        - opam/hamac-provisioning.opam
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      changes: *discovery_paths
  before_script:
    # Les .opam héritent (template marmiton) des pin-depends ocamlpro-cli/
    # codec déclarés en git+ssh, qui échouent en CI (pas de clé SSH). On
    # pinne d'abord ces sources en HTTPS via CI_JOB_TOKEN : opam les résout
    # alors sans SSH. On peut ensuite utiliser --deps-only (qui lit les
    # vraies deps des .opam, pas de liste manuelle fragile).
    # (`unix` n'est plus une fausse dep opam : retiré du recipe, tiré
    #  transitivement par lwt.unix / cohttp-lwt-unix côté dune.)
    - opam pin add -n -y ocamlpro-cli   "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ocamlpro.com/OCamlPro/ocamlpro-stdlib.git"
    - opam pin add -n -y ocamlpro-codec "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ocamlpro.com/OCamlPro/ocamlpro-stdlib.git"
    - opam install -y --deps-only ./opam/hamac-provisioning.opam ./opam/hamac-discovery.opam
  script:
    # Build du binaire en release et copie dans le contexte Docker pour
    # que l'image-build job le retrouve via artifacts.
    - opam exec -- dune build --profile=release pkgs/hamac-discovery
    - cp _build/default/pkgs/hamac-discovery/main.exe docker/hamac-discovery/discovery_server.exe
  artifacts:
    paths:
      - docker/hamac-discovery/discovery_server.exe
    expire_in: 1 day
  tags:
    - docker

build:hamac-discovery-image:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  needs:
    - job: build:hamac-discovery-binary
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *discovery_paths
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      changes: *discovery_paths
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # qemu-img/zstd/python3(+pyyaml) : uniquement pour générer les assets
    # raw.zst/.bmap ci-dessous, PAS pour l'initrd hamac-pxe (aucune
    # contrainte de taille/staticité ici, ce job docker:24-cli est une
    # image de build normale, pas le client PXE). bmaptool n'existe pas en
    # paquet Alpine — installé via pip (pas de contrainte de reproductibilité
    # aussi stricte que côté initrd, cet outil ne tourne jamais sur le
    # client).
    # `apk upgrade` avant `apk add` : `docker:24-cli` embarque des libs
    # figées au moment où cette image a été buildée (dont libexpat) ; les
    # nouveaux paquets (python3 ici) résolvent contre l'index apk actuel,
    # plus récent. Sans upgrade préalable, le python3 fraîchement installé
    # référence des symboles absents du vieux libexpat déjà présent
    # (`ImportError: ... XML_SetAllocTrackerActivationThreshold: symbol not
    # found` — rencontré réellement en CI). `apk upgrade` réaligne tout ce
    # qui est déjà installé sur l'index courant avant qu'on ajoute quoi que
    # ce soit de nouveau qui pourrait en dépendre.
    - apk update && apk upgrade --no-cache
    - apk add --no-cache bash qemu-img zstd python3 py3-yaml py3-pip git
    # bmaptool n'est pas sur PyPI (confirmé : ni "bmaptool" ni "bmap-tools"
    # n'existent comme distribution) — installé depuis son dépôt source
    # (le même que le paquet Debian bmaptool_3.9.0 utilisé côté initrd,
    # commit non pinné ici volontairement : cet outil ne tourne jamais sur
    # le client, seulement pendant ce build CI).
    - pip install --break-system-packages --no-cache-dir 'git+https://github.com/yoctoproject/bmaptool.git'
  script:
    # Le binaire vient de l'artefact du job binary. On copie aussi les
    # bundles + profils built-in dans le contexte (le Dockerfile les COPY
    # dans /usr/share/hamac/) pour que le discovery puisse rendre au runtime.
    - cp -r templates/bundles     docker/hamac-discovery/bundles
    - cp -r provisioning-profiles docker/hamac-discovery/profiles
    # Assets dérivés pour install physique (bmaptool), un par profil dont
    # os.format == qcow2 — cf. doc/PROVISIONING_SPEC.md §3.1 et
    # tools/discovery-prototype/pxe-build/prepare-os-assets.sh. Idempotent
    # et pas cher à refaire à chaque run de ce job (gated par changes: sur
    # provisioning-profiles/** de toute façon).
    - mkdir -p docker/hamac-discovery/images
    - |
      for profile in provisioning-profiles/*.yaml; do
        FMT=$(python3 -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])); print(d.get('os',{}).get('format',''))" "$profile")
        if [ "$FMT" = "qcow2" ]; then
          URL=$(python3 -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])); print(d.get('os',{}).get('url',''))" "$profile")
          NAME=$(python3 -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])); print(d.get('os',{}).get('image',''))" "$profile")
          echo "==> ${profile} : dérivation raw.zst+bmap depuis ${URL}"
          ./tools/discovery-prototype/pxe-build/prepare-os-assets.sh "$URL" "$NAME" docker/hamac-discovery/images
        fi
      done
    # NOTE : les champs os.raw_zst_url/raw_zst_sha256/bmap_url du profil
    # restent volontairement VIDES dans provisioning-profiles/*.yaml — le
    # fichier ci-dessus est généré ici (nom prévisible : ${NAME}.raw.zst /
    # ${NAME}.raw.zst.bmap dans /usr/share/hamac/images/), mais RIEN ne
    # renseigne encore ces 3 champs avec l'URL réellement servie par ce
    # discovery (dépend de son host/port au déploiement, pas connu au
    # moment d'écrire ce YAML). pxe-build/init retombera donc sur le
    # fallback qemu-img tant que ce câblage n'est pas fait — voir la
    # discussion associée à ce changement pour les options (calcul dynamique
    # côté hamac-discovery au rendu, vs. renseigner les champs manuellement
    # post-déploiement).
    - docker build -t "${IMAGE_DISCOVERY}:${CI_COMMIT_SHORT_SHA}" docker/hamac-discovery/
    - export BRANCH_TAG=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
    - docker tag "${IMAGE_DISCOVERY}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_DISCOVERY}:${BRANCH_TAG}"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${IMAGE_DISCOVERY}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_DISCOVERY}:latest"
        docker push "${IMAGE_DISCOVERY}:latest"
      fi
    - docker push "${IMAGE_DISCOVERY}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_DISCOVERY}:${BRANCH_TAG}"
  tags:
    - docker

#############################################################################
# BUILD — hamac-pxe
#
# Pas de compilation OCaml ici : juste un docker build qui copie les
# fichiers TFTP (kernel + initramfs) depuis tools/discovery-prototype/tftp/.
#############################################################################

build:hamac-pxe:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  # Pas de DOCKER_HOST / DOCKER_TLS_CERTDIR : on laisse le défaut TLS
  # automatique (DinD écoute sur 2376 avec TLS auto-généré, et
  # docker:24-cli sait s'y connecter via /certs/client). C'est le pattern
  # qui marche pour les autres services OCP-SI (cf. CICD.md).
  rules:
    # Pour les MR : on rebuild dès que les sources de l'initramfs (init
    # script) ou de l'image Docker bougent, OU si on bump les sha
    # Debian/busybox-static pinnés (modifs sur .gitlab-ci.yml).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &pxe_paths
        - tools/discovery-prototype/pxe-build/init
        - docker/hamac-pxe/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      changes: *pxe_paths
  before_script:
    - apk add --no-cache wget cpio gzip coreutils dpkg
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # 1. Download le noyau et l'initrd du netboot installer Debian (URL +
    #    sha256 pinés). Pas de `-q` pour avoir les logs de download en cas
    #    d'échec.
    - mkdir -p docker/hamac-pxe/tftp
    - wget -O docker/hamac-pxe/tftp/vmlinuz "${DEBIAN_NETBOOT_URL}/linux"
    - wget -O /tmp/debian-initrd.gz         "${DEBIAN_NETBOOT_URL}/initrd.gz"
    - ls -lh docker/hamac-pxe/tftp/vmlinuz /tmp/debian-initrd.gz
    # 2. Vérification d'intégrité — si Debian change ces fichiers (nouveau
    #    point-release) on FAIL plutôt que de produire une image qui n'a
    #    pas été validée manuellement.
    #    `sha256sum -c` attend EXACTEMENT 2 espaces entre le hash et le path.
    - printf '%s  %s\n' "${DEBIAN_LINUX_SHA256}"  "docker/hamac-pxe/tftp/vmlinuz" | sha256sum -c -
    - printf '%s  %s\n' "${DEBIAN_INITRD_SHA256}" "/tmp/debian-initrd.gz"         | sha256sum -c -
    # 3. Download busybox-static (voir commentaire BUSYBOX_STATIC_URL plus
    #    haut — remplace le busybox minimal de l'installeur Debian, qui
    #    n'implémente pas `--install`).
    - wget -O /tmp/busybox-static.deb "${BUSYBOX_STATIC_URL}"
    - printf '%s  %s\n' "${BUSYBOX_STATIC_SHA256}" "/tmp/busybox-static.deb" | sha256sum -c -
    - mkdir -p /tmp/busybox-extract && dpkg-deb -x /tmp/busybox-static.deb /tmp/busybox-extract
    # 3b. Download le paquet noyau complet, uniquement pour en extraire
    #     nvme.ko.xz/nvme-core.ko.xz/nvme-auth.ko.xz (voir commentaire
    #     LINUX_IMAGE_URL plus haut — absents du netboot initrd et d'aucun
    #     udeb, indispensables pour détecter le SSD sur le Framework
    #     Laptop 13 et tout matériel NVMe).
    - wget -O /tmp/linux-image.deb "${LINUX_IMAGE_URL}"
    - printf '%s  %s\n' "${LINUX_IMAGE_SHA256}" "/tmp/linux-image.deb" | sha256sum -c -
    - mkdir -p /tmp/linux-image-extract && dpkg-deb -x /tmp/linux-image.deb /tmp/linux-image-extract
    # 3c. Download bmaptool + zstd + les dépendances runtime RÉELLES (voir
    #     commentaire des variables plus haut — set déterminé
    #     empiriquement via readelf -d + test réel bmaptool create/copy,
    #     pas en devinant depuis les Depends: déclarés des paquets).
    - mkdir -p /tmp/bmap-extract
    - |
      # Séparateur "|" (pas ":") : les URLs contiennent elles-mêmes des ":"
      # (le "://" du scheme) — un split naïf sur ":" en 3 champs coupe
      # l'URL après "https" et décale tout le reste (bug réel rencontré en
      # CI : wget partait chercher "http://https/", et sha256sum recevait
      # le morceau d'URL restant collé au vrai hash).
      for pair in \
        "liblz4|${LIBLZ4_URL}|${LIBLZ4_SHA256}" \
        "zstd|${ZSTD_URL}|${ZSTD_SHA256}" \
        "libzstd1|${LIBZSTD1_URL}|${LIBZSTD1_SHA256}" \
        "libssl3|${LIBSSL3_URL}|${LIBSSL3_SHA256}" \
        "python3-minimal|${PYTHON3_MINIMAL_URL}|${PYTHON3_MINIMAL_SHA256}" \
        "libpython3-minimal|${LIBPYTHON3_MINIMAL_URL}|${LIBPYTHON3_MINIMAL_SHA256}" \
        "libpython3-stdlib|${LIBPYTHON3_STDLIB_URL}|${LIBPYTHON3_STDLIB_SHA256}" \
        "bmaptool|${BMAPTOOL_URL}|${BMAPTOOL_SHA256}" \
      ; do
        name="${pair%%|*}"
        rest="${pair#*|}"
        url="${rest%%|*}"
        sha="${rest#*|}"
        wget -O "/tmp/${name}.deb" "$url"
        printf '%s  %s\n' "$sha" "/tmp/${name}.deb" | sha256sum -c -
        dpkg-deb -x "/tmp/${name}.deb" /tmp/bmap-extract
      done
    # 3d. Build le qemu-img statique from-source (stage qemu-img-builder de
    #     ce même Dockerfile) — fallback pour les profils/initrd pas encore
    #     migrés au chemin bmaptool. Build-testé de bout en bout (static-pie
    #     linked, zéro NEEDED, `qemu-img convert` fonctionnel) — cf.
    #     commentaire du stage dans docker/hamac-pxe/Dockerfile. `docker
    #     create` + `docker cp` plutôt que `docker build --output` : plus
    #     simple à faire tourner tel quel sur le docker:24-cli de ce job,
    #     pas besoin de BuildKit local-export.
    - docker build --target qemu-img-builder -t qemu-img-builder-tmp docker/hamac-pxe/
    - QIB_CID=$(docker create qemu-img-builder-tmp)
    - docker cp "${QIB_CID}:/usr/src/qemu/build/qemu-img" /tmp/qemu-img-static
    - docker rm "${QIB_CID}"
    # 4. Reconstruire l'initramfs hybride : initrd Debian officiel (busybox
    #    + modules noyau déjà alignés sur ce même noyau) + notre init
    #    script + les modules NVMe du 3b. On extrait l'initrd Debian, on
    #    remplace son busybox par le busybox-static téléchargé ci-dessus,
    #    on ajoute les .ko.xz NVMe manquants, et son /init par le nôtre,
    #    on re-pack en cpio+gzip.
    - mkdir -p /tmp/initramfs-build
    - cd /tmp/initramfs-build && gunzip -c /tmp/debian-initrd.gz | cpio -idm
    - cp /tmp/busybox-extract/usr/bin/busybox bin/busybox
    - chmod +x bin/busybox
    - |
      KVER=$(ls lib/modules)
      SRC="/tmp/linux-image-extract/usr/lib/modules/${KVER}/kernel/drivers/nvme"
      mkdir -p "lib/modules/${KVER}/kernel/drivers/nvme/host" "lib/modules/${KVER}/kernel/drivers/nvme/common"
      cp "${SRC}/host/nvme.ko.xz" "${SRC}/host/nvme-core.ko.xz" "lib/modules/${KVER}/kernel/drivers/nvme/host/"
      cp "${SRC}/common/nvme-auth.ko.xz" "lib/modules/${KVER}/kernel/drivers/nvme/common/"
    # ext4/jbd2 : même trou que NVMe ci-dessus — absents de l'initrd netboot
    # de base (confirmé : ni builtin, ni .ko.xz nulle part dans son arbre
    # lib/modules), le support ext4 étant normalement fourni par un udeb
    # séparé pendant une vraie install d-i, jamais chargé ici puisqu'on
    # remplace /init entièrement. Conséquence concrète observée sur
    # matériel réel : `mount /dev/nvme0n1p1 /mnt/root` échoue avec
    # "Invalid argument" (busybox essaie chaque type listé dans
    # /proc/filesystems, "ext4" n'y figure jamais faute de module chargé).
    # Récupérés du même paquet linux-image que les modules NVMe (donc même
    # vermagic, aucun téléchargement supplémentaire). Dépendances de
    # ext4.ko.xz (`modinfo`/`depends=` : jbd2,crc16,mbcache) — crc16 et
    # mbcache sont déjà présents dans l'initrd de base, seul jbd2 manque
    # en plus d'ext4 lui-même.
    - |
      SRC="/tmp/linux-image-extract/usr/lib/modules/${KVER}/kernel/fs"
      mkdir -p "lib/modules/${KVER}/kernel/fs/ext4" "lib/modules/${KVER}/kernel/fs/jbd2"
      cp "${SRC}/ext4/ext4.ko.xz" "lib/modules/${KVER}/kernel/fs/ext4/"
      cp "${SRC}/jbd2/jbd2.ko.xz" "lib/modules/${KVER}/kernel/fs/jbd2/"
    # blkdiscard est déjà présent dans l'initrd netboot Debian, rien à
    # copier pour lui. zstd + bmaptool + python3 : voir commentaire des
    # variables LIBLZ4_URL et suivantes plus haut pour le détail du set.
    - |
      BE=/tmp/bmap-extract
      cp "$BE/usr/bin/zstd" bin/zstd
      cp "$BE"/usr/lib/x86_64-linux-gnu/liblz4.so.1* usr/lib/x86_64-linux-gnu/
      cp "$BE"/usr/lib/x86_64-linux-gnu/libzstd.so.1* usr/lib/x86_64-linux-gnu/
      cp "$BE"/usr/lib/x86_64-linux-gnu/libssl.so.3* "$BE"/usr/lib/x86_64-linux-gnu/libcrypto.so.3* usr/lib/x86_64-linux-gnu/
      cp "$BE/usr/bin/python3.13" usr/bin/python3.13
      ln -sf python3.13 usr/bin/python3
      cp -r "$BE/usr/lib/python3.13" usr/lib/
      cp -r "$BE/usr/lib/python3/dist-packages/bmaptool" usr/lib/python3.13/
      cp "$BE/usr/bin/bmaptool" usr/bin/bmaptool
      chmod +x usr/bin/bmaptool usr/bin/python3.13 bin/zstd
    - cp /tmp/qemu-img-static usr/bin/qemu-img
    - chmod +x usr/bin/qemu-img
    - cp "${CI_PROJECT_DIR}/tools/discovery-prototype/pxe-build/init" init
    - chmod +x init
    - find . | cpio -o -H newc | gzip > "${CI_PROJECT_DIR}/docker/hamac-pxe/tftp/initramfs-hybrid.gz"
    - cd "${CI_PROJECT_DIR}"
    # 5. Build de l'image
    - docker build -t "${IMAGE_PXE}:${CI_COMMIT_SHORT_SHA}" docker/hamac-pxe/
    - export BRANCH_TAG=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
    - docker tag "${IMAGE_PXE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PXE}:${BRANCH_TAG}"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${IMAGE_PXE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_PXE}:latest"
        docker push "${IMAGE_PXE}:latest"
      fi
    - docker push "${IMAGE_PXE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_PXE}:${BRANCH_TAG}"
  tags:
    - docker

