build_info:

dune:
  name: hamac
  packages:
    # Le format pivot : types, chargeur LOAF, diagnostics, treillis, langage
    # de contraintes et validation. Utilisable sans le reste de Hamac par
    # tout outil qui lit ou produit des manifestes.
    #
    # Les manifestes LOAF sont lus par la bibliothèque loaf. Le vocabulaire
    # (vocabulary/hamac.loaf) est installé dans le site dune [vocabulary] du
    # paquet et trouvé par dune-site. marmiton ne sait pas encore exprimer
    # les sites : la déclaration « (sites (share vocabulary)) » de
    # dune-project et la stanza « generate_sites_module » de
    # pkgs/hamac-manifest/dune sont reportées à la main (l'installation
    # elle-même est dans pkgs/hamac-manifest/vocabulary/dune, que marmiton
    # ne génère pas).
    - name: hamac-manifest
      kind: library
      depends:
        - name: loaf
        - name: dune-site
      ppx:
        - name: ppx_deriving
          modules: [ppx_deriving.std]

    # Liaison OCaml de libclingo (API C de clingo, solveur ASP), sans
    # dépendance à Hamac. marmiton ne sait exprimer ni les stubs C ni la
    # découverte d'une bibliothèque système : les champs foreign_stubs et
    # c_library_flags de pkgs/hamac-clingo/dune, sa règle de découverte
    # (pkgs/hamac-clingo/config/, dune-configurator) et la dépendance
    # dune-configurator de dune-project sont reportés à la main. libclingo
    # est une dépendance système (depexts : opam/hamac-clingo.opam.template).
    - name: hamac-clingo
      kind: library
      depends:
        - name: fmt

    - name: hamac-provisioning
      kind: library
      depends:
        - name: hamac-manifest
        - name: yaml
        - name: fpath
        - name: bos
        - name: jingoo
      ppx:
        - name: ppx_deriving
          modules: [ppx_deriving.std]

    - name: hamac
      kind: executable
      depends:
        - name: hamac-manifest
        - name: hamac-provisioning
        - name: fpath
        - name: hamac-clingo
        - name: logs
          modules: [logs.fmt]
        - name: cmdliner
        - name: cohttp-lwt-unix
        - name: lwt
        - name: yojson
      ppx:
        - name: ppx_deriving
          modules: [ppx_deriving.std]
      # Reporté à la main dans pkgs/hamac/dune : la règle qui embarque le
      # programme du planificateur (hamac.lp → module Hamac_lp) et son
      # installation dans share/hamac.
      target: bytecode

    - name: hamac-discovery
      kind: executable
      depends:
        - name: hamac-manifest
        - name: hamac-provisioning
        - name: cohttp-lwt-unix
        - name: lwt
          modules: [lwt.unix]
        - name: yojson
        # `unix` n'est PAS listé : ce n'est pas un package opam (lib findlib
        # du compilateur). Il est tiré transitivement par lwt.unix /
        # cohttp-lwt-unix et résolu par dune via findlib.
      # native : l'image Docker n'embarque pas de runtime OCaml
      target: native
