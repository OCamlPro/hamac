# SIESTE Discovery Prototype - dnsmasq configuration
# DHCP + TFTP server for PXE boot

# Interface binding
interface=virbr-sieste
bind-interfaces

# DHCP configuration
dhcp-range=10.99.0.100,10.99.0.200,255.255.255.0,12h
dhcp-option=option:router,10.99.0.1
dhcp-option=option:dns-server,10.99.0.1

# PXE boot configuration
# Option 66: TFTP server address
# Option 67: Boot filename
dhcp-boot=pxelinux.0,sieste-discovery,10.99.0.1

# Enable TFTP
enable-tftp
tftp-root=/home/julius/ocp/sieste/tools/discovery-prototype/tftp

# Logging
log-queries
log-dhcp

# PID file
pid-file=/tmp/sieste-dnsmasq.pid

# Don't use /etc/hosts
no-hosts

# Don't read /etc/resolv.conf
no-resolv

# Upstream DNS (for VM internet access)
server=8.8.8.8
