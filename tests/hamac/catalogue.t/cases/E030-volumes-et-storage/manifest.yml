# E030-volumes-et-storage
manifest_version: "1.1"
kind: service
name: web
runtime: http
artifact:
  path: registry.example.org/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  format: oci-image
volumes:
  - host: /srv/web
    container: /data
storage:
  - name: data
    mount: /data
    class: ephemeral
