#
# L'API RH : zone rh (confidential, catégories rh et finance). Chaque route
# porte l'autorisation que la bordure vérifie avant de transmettre.

manifest_version: "1.1"
kind: service
name: hr-api
runtime: http

artifact:
  path: registry.example.org/rh/hr-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  format: oci-image

consumes:
  - name: db
    capability: database
    inject:
      DATABASE_URL: "postgresql://{user}:{password}@{host}:{port}/{dbname}"

secrets:
  - name: session_key
    generate: { kind: alnum, length: 64 }
    rotate: 90d

environment:
  SESSION_KEY: "{secret.session_key}"

security:
  zone: rh
  route_labels:
    - route: /health
      public: true
    - route: /employees/*
      methods: [GET]
      classification: internal
      categories: [rh]
      required_clearance: [rh, admin]
    - route: /employees/salaries
      classification: confidential
      categories: [rh, finance]
      required_clearance: [comptable, admin]

ports:
  - container: 8080

exposure:
  - hostname: api.rh.example.org
    port: 8080
    tls: acme

placement:
  spread: failure_domain

resources:
  memory_request: 256Mi
  memory_limit: 512Mi
  cpu_limit: "1"

replicas: 2

health_check:
  path: /health
  interval: 10
  timeout: 3
