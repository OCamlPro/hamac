#
# Un patron d'exemple : le treillis de l'organisation, ses zones, et
# quelques contraintes que la topologie calculée doit satisfaire.

manifest_version: "1.1"
kind: pattern
name: exemple-rh
version: "1.0.0"

lattice:
  levels: [public, internal, confidential]
  categories: [rh, finance]

zones:
  - name: public
    level: public
  - name: internal
    level: internal
  - name: rh
    level: confidential
    categories: [rh, finance]

assurance:
  rh: { boot: measured-tpm2, physical: site }

constraints:
  - id: one-level-per-host
    description: "Deux niveaux ne partagent jamais un noyau"
    expr: "forall h in hosts: count(levels_on(h)) <= 1"
  - id: stateful-quorum
    description: "Un service à état survit à la perte d'un domaine de panne"
    expr: >
      forall s in services where stateful(s):
        count(failure_domains(hosts_of(s))) >= 3
  - id: rh-on-site
    description: "Les données RH restent sur le site"
    expr: >
      forall s in services where zone(s) = "rh":
        forall h in hosts_of(s): h.physical = "site"

objectives:
  - minimize: count(hosts_used)
    priority: 1
  - minimize: moves
    priority: 2
