manifest_version: "1.1"
kind: service
name: portal
runtime: http

artifact:
  path: registry.example.org/rh/portal@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  format: oci-image

security:
  zone: public

ports:
  - container: 8080

exposure:
  - hostname: rh.example.org
    port: 8080
    tls: acme

resources:
  memory_limit: 256Mi
  cpu_limit: "0.5"

replicas: 2

health_check:
  path: /health
  interval: 10
  timeout: 3
