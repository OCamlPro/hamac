# Forgejo Actions CI pour hamac.
#
# Runner SI OCamlPro : label `docker` => job dans node:20-bookworm, isolation
# DinD (docker_host: "-"). => pas de `container:` de job (docker create pend).
# On installe OCaml/opam via apt, et on fait un checkout git MANUEL (pas
# d'action externe : évite la dépendance au proxy code.forgejo.org + node).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: docker
    env:
      OPAMROOTISOK: "1"          # node:20-bookworm tourne en root
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git + opam + OCaml + build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates opam ocaml m4 pkg-config build-essential libyaml-dev

      - name: Checkout (manual clone, no external action)
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -f FETCH_HEAD
          git log --oneline -1

      - name: Init opam (no sandbox inside a container)
        run: opam init --bare --disable-sandboxing -y

      - name: Switch (system OCaml) + install project deps (public opam only)
        run: |
          opam switch create . ocaml-system --no-install -y
          opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
