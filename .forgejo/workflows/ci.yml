name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: docker
    env:
      OPAMROOTISOK: "1"
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Diagnostics + install git/opam/OCaml/build deps
        run: |
          set -eux
          echo "--- disk before ---"; df -h /
          echo "--- mem ---"; free -m || true
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates opam ocaml m4 pkg-config build-essential libyaml-dev
          echo "--- disk after ---"; df -h /
          echo "=== INSTALL STEP COMPLETED OK ==="

      - name: Checkout (manual clone)
        run: |
          set -eux
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -f FETCH_HEAD
          git log --oneline -1

      - name: opam init + switch (system OCaml) + deps
        run: |
          set -eux
          opam init --bare --disable-sandboxing -y
          opam switch create . ocaml-system --no-install -y
          opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
