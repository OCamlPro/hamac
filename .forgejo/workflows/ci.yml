name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: docker
    env:
      OPAMROOTISOK: "1"
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git + opam + OCaml + build deps
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates opam ocaml m4 pkg-config build-essential libyaml-dev

      - name: Checkout (auth + diagnostic, tolère la casse)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu   # pas de -x : ne pas logger le token
          echo "server=$GITHUB_SERVER_URL repo=$GITHUB_REPOSITORY ref=$GITHUB_REF_NAME"
          echo "token length: ${#GH_TOKEN}"
          git config --global --add safe.directory "$PWD"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config --global http."${GITHUB_SERVER_URL}/".extraheader "Authorization: Basic ${AUTH}"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if ! git fetch --depth 1 origin "${GITHUB_REF_NAME}"; then
            echo "fetch KO -> retry avec chemin en minuscules"
            lc=$(printf '%s' "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')
            git remote set-url origin "${GITHUB_SERVER_URL}/${lc}.git"
            git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          fi
          git checkout -q -f FETCH_HEAD
          echo "checked out: $(git log --oneline -1)"

      - name: opam init + switch (system OCaml) + deps
        run: |
          set -eux
          opam init --bare --disable-sandboxing -y
          opam switch create . ocaml-system --no-install -y
          opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
