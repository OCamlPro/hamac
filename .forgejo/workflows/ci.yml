name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: docker
    env:
      OPAMROOTISOK: "1"
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git + opam + OCaml + build deps
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates opam ocaml m4 pkg-config build-essential libyaml-dev

      - name: Checkout (manual clone, authenticated with job token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu   # pas de -x : ne pas logguer le token
          git config --global --add safe.directory "$PWD"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git init -q .
          git config --global http."${GITHUB_SERVER_URL}/".extraheader "Authorization: Basic ${AUTH}"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -f FETCH_HEAD
          echo "checked out:"; git log --oneline -1

      - name: opam init + switch (system OCaml) + deps
        run: |
          set -eux
          opam init --bare --disable-sandboxing -y
          opam switch create . ocaml-system --no-install -y
          opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
