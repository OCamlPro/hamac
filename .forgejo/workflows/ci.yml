# Forgejo Actions CI pour hamac.
#
# Runner SI OCamlPro (cf. si/configs/shared.yaml + forgejo-runner_config.yaml) :
# le label `docker` exécute le job dans node:20-bookworm, et l'isolation DinD
# (`docker_host: "-"`) prive les jobs d'accès au démon Docker. => on N'utilise
# PAS de `container:` de job (créerait un conteneur imbriqué => docker create
# pend). On tourne directement dans node:20-bookworm et on installe OCaml/opam.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: docker
    env:
      OPAMROOTISOK: "1"          # node:20-bookworm tourne en root
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install opam + OCaml + build deps (Debian)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            opam ocaml m4 pkg-config build-essential libyaml-dev git ca-certificates

      - name: Init opam (no sandbox inside a container)
        run: opam init --bare --disable-sandboxing -y

      - name: Switch (system OCaml) + install project deps (public opam only)
        run: |
          opam switch create . ocaml-system --no-install -y
          opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

  # TODO (incrément suivant) : jobs images hamac-discovery / hamac-pxe
  # via `runs-on: dind` (docker:dind), portés du GitLab CI, sans deploy.
