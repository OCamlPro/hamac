# Forgejo Actions CI pour hamac.
#
# Runners de la stack SI OCamlPro (cf. si/configs/shared.yaml) :
#   - label `docker` -> jobs dans un conteneur node:20-bookworm
#   - label `dind`   -> jobs dans docker:dind (privileged, pour builder des images)
# Les actions (`uses:`) résolvent via code.forgejo.org (DEFAULT_ACTIONS_URL),
# donc `actions/checkout` est disponible ; on n'utilise PAS d'action GitHub-only
# (ex. ocaml/setup-ocaml) — on passe par une image opam.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: docker
    container:
      image: ocaml/opam:debian-12-ocaml-5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout peut écrire le workspace sous un autre uid que l'user
      # `opam` de l'image ; on rétablit la propriété (sudo dispo dans ocaml/opam).
      - name: Fix workspace ownership
        run: sudo chown -R opam:opam .

      - name: Install dependencies (public opam only)
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

  # TODO (incrément suivant, label `dind`) : build des images docker
  #   hamac-discovery / hamac-pxe (portage des jobs GitLab, sans deploy).
